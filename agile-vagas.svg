<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Agile Vagas - app de vagas da Agile Consultoria">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e2c7"/>
      <stop offset="1" stop-color="#e9cfa6"/>
    </linearGradient>
    <linearGradient id="vinho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f1530"/>
      <stop offset="1" stop-color="#5e0c1d"/>
    </linearGradient>
    <clipPath id="tela"><rect x="905" y="62" width="250" height="330" rx="22"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .card { animation: sobe 6s ease-in-out infinite; }
    .c2 { animation-delay: 2s; }
    .c3 { animation-delay: 4s; }
    @keyframes sobe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  </style>
  <rect width="1280" height="440" rx="22" fill="url(#fundo)"/>
  <circle cx="1180" cy="40" r="160" fill="#b7892b" fill-opacity="0.12"/>
  <circle cx="60" cy="430" r="120" fill="#7a1026" fill-opacity="0.07"/>

  <rect x="70" y="70" width="190" height="36" rx="18" fill="#7a1026"/>
  <text x="165" y="95" class="t" font-size="18" font-weight="700" fill="#f3e2c7" text-anchor="middle" letter-spacing="2">APP NO AR</text>
  <text x="66" y="185" class="t" font-size="84" font-weight="800" fill="#7a1026">Agile Vagas</text>
  <text x="70" y="232" class="t" font-size="28" font-weight="500" fill="#2b1b1f">Vagas do LinkedIn prontas para o WhatsApp,</text>
  <text x="70" y="268" class="t" font-size="28" font-weight="500" fill="#2b1b1f">feito para a Agile Consultoria.</text>

  <g class="t" font-size="20" font-weight="600">
    <rect x="70" y="300" width="236" height="40" rx="20" fill="#ffffff" fill-opacity="0.7" stroke="#b7892b"/>
    <text x="188" y="327" text-anchor="middle" fill="#5e0c1d">Busca automática</text>
    <rect x="320" y="300" width="250" height="40" rx="20" fill="#ffffff" fill-opacity="0.7" stroke="#b7892b"/>
    <text x="445" y="327" text-anchor="middle" fill="#5e0c1d">Confere se está aberta</text>
    <rect x="584" y="300" width="210" height="40" rx="20" fill="#ffffff" fill-opacity="0.7" stroke="#b7892b"/>
    <text x="689" y="327" text-anchor="middle" fill="#5e0c1d">Gera a arte</text>
  </g>
  <text x="70" y="390" class="t" font-size="19" font-weight="600" fill="#8a6a3a" letter-spacing="1">HTML · JAVASCRIPT · GOOGLE APPS SCRIPT · INSTALÁVEL NO CELULAR</text>

  <!-- celular -->
  <rect x="890" y="44" width="280" height="366" rx="34" fill="#2b1b1f"/>
  <g clip-path="url(#tela)">
    <rect x="905" y="62" width="250" height="330" fill="#fbf4ea"/>
    <rect x="905" y="62" width="250" height="58" fill="url(#vinho)"/>
    <text x="1030" y="98" class="t" font-size="18" font-weight="700" fill="#f3e2c7" text-anchor="middle">Vagas de hoje</text>
    <g class="card">
      <rect x="920" y="134" width="220" height="70" rx="12" fill="#ffffff" stroke="#e5d3b3"/>
      <rect x="932" y="148" width="40" height="40" rx="10" fill="#b7892b"/>
      <rect x="984" y="152" width="120" height="10" rx="5" fill="#2b1b1f"/>
      <rect x="984" y="170" width="84" height="8" rx="4" fill="#caa1a7"/>
    </g>
    <g class="card c2">
      <rect x="920" y="214" width="220" height="70" rx="12" fill="#ffffff" stroke="#e5d3b3"/>
      <rect x="932" y="228" width="40" height="40" rx="10" fill="#7a1026"/>
      <rect x="984" y="232" width="104" height="10" rx="5" fill="#2b1b1f"/>
      <rect x="984" y="250" width="96" height="8" rx="4" fill="#caa1a7"/>
    </g>
    <g class="card c3">
      <rect x="920" y="294" width="220" height="70" rx="12" fill="#ffffff" stroke="#e5d3b3"/>
      <rect x="932" y="308" width="40" height="40" rx="10" fill="#b7892b"/>
      <rect x="984" y="312" width="128" height="10" rx="5" fill="#2b1b1f"/>
      <rect x="984" y="330" width="70" height="8" rx="4" fill="#caa1a7"/>
    </g>
  </g>
  <rect x="1000" y="52" width="60" height="6" rx="3" fill="#4a3a3e"/>
</svg>
